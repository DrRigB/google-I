<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google I - Image Analysis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    {% load static %}
    <link rel="stylesheet" href="{% static 'vision/css/style.css' %}">
    <style>
        .gallery-link {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 10;
        }
        @media (max-width: 768px) {
            .gallery-link {
                position: relative;
                top: auto;
                right: auto;
                text-align: center;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="gallery-link animate__animated animate__fadeIn">
        <a href="{% url 'vision:gallery' %}" class="btn btn-outline-primary">
            <span>View Gallery</span>
        </a>
    </div>

    <div class="header text-center animate__animated animate__fadeIn">
        <div class="container">
            <h1 class="logo mb-0">
                <span>G</span><span>o</span><span>o</span><span>g</span><span>l</span><span>e</span> I
            </h1>
            <p class="mt-2">Image analysis powered by Google AI</p>
        </div>
    </div>
    
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="upload-container animate__animated animate__fadeInUp">
                    <h2 class="mb-4">Upload an Image</h2>
                    <div id="drop-area" class="drop-area">
                        <div class="upload-icon">📸</div>
                        <p>Drag & Drop your image here or click to browse</p>
                        <p class="text-muted small">Supported formats: JPG, PNG, GIF</p>
                        <input type="file" id="file-input" class="file-input" accept="image/*">
                    </div>
                    <div class="mb-3">
                        <label for="title-input" class="form-label">Image Title (optional)</label>
                        <input type="text" class="form-control" id="title-input" placeholder="Enter a title for your image">
                    </div>
                    <button id="upload-btn" class="btn btn-primary w-100">Analyze Image</button>
                </div>
                
                <div id="loader" class="loader">
                    <!-- Loader content will be added dynamically via JavaScript -->
                </div>
                
                <div id="result-container" class="result-container">
                    <h2 class="mb-4 animate__animated animate__fadeIn">Analysis Results</h2>
                    <div class="text-center mb-4 animate__animated animate__zoomIn">
                        <img id="result-image" class="result-image" src="" alt="Analyzed image">
                    </div>
                    <div class="mb-4 animate__animated animate__fadeIn animate__delay-1s">
                        <h3>AI Description</h3>
                        <div id="description-text" class="p-3 bg-light rounded"></div>
                    </div>
                    <div class="d-flex justify-content-between animate__animated animate__fadeIn animate__delay-2s">
                        <button id="analyze-another-btn" class="btn btn-outline-primary flex-grow-1 me-2">Analyze Another Image</button>
                        <a id="view-in-gallery-btn" href="{% url 'vision:gallery' %}" class="btn btn-primary flex-grow-1 ms-2">View in Gallery</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{% static 'vision/js/main.js' %}"></script>
</body>
</html>
